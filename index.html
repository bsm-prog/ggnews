<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도의회 보도자료 검색 엔진</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #777777;
            --border-color: #e0e0e0;
            /* 카테고리별 포인트 컬러 */
            --c-finance: #1a4b8c;
            --c-economy: #e67e22;
            --c-safety: #d9534f;
            --c-culture: #8e44ad;
            --c-science: #27ae60;
            --c-environment: #2c3e50;
            --c-construct: #8b4513;
            --c-health: #c0392b;
            --c-agri: #2ecc71;
            --c-edu: #2980b9;
            --c-women: #e84393;
            --c-etc: #95a5a6;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #222;
        }

        .header p {
            margin: 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        /* 검색 제어판 */
        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .search-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-panel select, .control-panel input[type="text"] {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            flex: 1;
            min-width: 150px;
        }

        .control-panel select:focus, .control-panel input[type="text"]:focus {
            border-color: #555;
        }

        .hot-issue-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--c-safety);
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 20px;
            background-color: #fff0f0;
            border: 1px solid #ffcccc;
            transition: all 0.3s ease;
        }
        
        .hot-issue-toggle:hover {
            background-color: #ffe6e6;
        }

        .hot-issue-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* 카테고리 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 카테고리 카드 (아코디언) */
        .category-card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            border-top: 5px solid var(--c-etc);
            display: flex;
            flex-direction: column;
        }

        .category-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background-color: #fafafa;
        }
        
        .category-header:hover {
            background-color: #f0f0f0;
        }

        .category-title {
            font-size: 16px;
            font-weight: bold;
        }

        .badge {
            background-color: var(--c-etc);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 아코디언 펼쳐짐 아이콘 */
        .toggle-icon {
            font-size: 12px;
            transition: transform 0.3s;
        }
        .category-card.active .toggle-icon {
            transform: rotate(180deg);
        }

        /* 기사 리스트 영역 */
        .article-list {
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.3s ease-out;
            background: white;
        }
        
        .category-card.active .article-list {
            max-height: 400px; /* 스크롤 가능 높이 지정 */
            border-top: 1px solid var(--border-color);
        }

        /* 개별 기사 아이템 */
        .article-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .article-item:last-child {
            border-bottom: none;
        }
        
        .article-meta {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .article-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .article-title a {
            text-decoration: none;
            color: var(--text-main);
        }
        
        .article-title a:hover {
            text-decoration: underline;
            color: #0056b3;
        }

        .hot-badge {
            color: #d9534f;
            font-weight: bold;
            margin-right: 5px;
        }

        .article-snippet {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 색상 매핑 클래스 */
        .border-finance { border-top-color: var(--c-finance); }
        .bg-finance { background-color: var(--c-finance) !important; }
        
        .border-economy { border-top-color: var(--c-economy); }
        .bg-economy { background-color: var(--c-economy) !important; }
        
        .border-safety { border-top-color: var(--c-safety); }
        .bg-safety { background-color: var(--c-safety) !important; }
        
        .border-culture { border-top-color: var(--c-culture); }
        .bg-culture { background-color: var(--c-culture) !important; }
        
        .border-science { border-top-color: var(--c-science); }
        .bg-science { background-color: var(--c-science) !important; }
        
        .border-environment { border-top-color: var(--c-environment); }
        .bg-environment { background-color: var(--c-environment) !important; }
        
        .border-construct { border-top-color: var(--c-construct); }
        .bg-construct { background-color: var(--c-construct) !important; }
        
        .border-health { border-top-color: var(--c-health); }
        .bg-health { background-color: var(--c-health) !important; }
        
        .border-agri { border-top-color: var(--c-agri); }
        .bg-agri { background-color: var(--c-agri) !important; }
        
        .border-edu { border-top-color: var(--c-edu); }
        .bg-edu { background-color: var(--c-edu) !important; }
        
        .border-women { border-top-color: var(--c-women); }
        .bg-women { background-color: var(--c-women) !important; }

        /* 데이터 없음 표시 */
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            grid-column: 1 / -1;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>경기도의회 보도자료 검색 엔진</h1>
        <p>최근 업데이트: <span id="last-updated-time">로딩 중...</span></p>
    </div>

    <div class="control-panel">
        <div class="search-row">
            <select id="select-muni">
                <option value="">시군 전체</option>
                <!-- 주요 시군 하드코딩, 필요시 추가 -->
                <option value="수원시">수원시</option><option value="고양시">고양시</option><option value="용인시">용인시</option>
                <option value="성남시">성남시</option><option value="부천시">부천시</option><option value="화성시">화성시</option>
                <option value="안산시">안산시</option><option value="남양주시">남양주시</option><option value="안양시">안양시</option>
                <option value="평택시">평택시</option><option value="시흥시">시흥시</option><option value="파주시">파주시</option>
                <option value="의정부시">의정부시</option><option value="김포시">김포시</option><option value="광주시">광주시</option>
                <option value="광명시">광명시</option><option value="군포시">군포시</option><option value="하남시">하남시</option>
            </select>
            
            <select id="select-member"><button>
                <option value="">의원 전체</option>
                <option value="강성삼">강성삼</option>
                <option value="고은정">고은정</option>
                <option value="고찬석">고찬석</option>
                <option value="안광률">안광률</option>
                <option value="장한별">장한별</option>
                <option value="이오수">이오수</option>
                <option value="김태희">김태희</option>
                <!-- 의원 명단은 추후 HTML에 직접 추가 가능 -->
            </select>
           
            <input type="text" id="input-keyword" placeholder="🔍 추가 이슈어 검색 (예: 예산, 지하철)"> <button>
        </div>

        <label class="hot-issue-toggle">
            <input type="checkbox" id="check-hot">
            🚨 핫이슈만 보기 (지연, 반발, 논란 등 필터링)
        </label>
    </div>

    <div class="grid-container" id="category-grid">
        <!-- 자바스크립트를 통해 카테고리 카드들이 여기에 생성됩니다. -->
    </div>
</div>

<script>
    // 11개 카테고리 정의 및 고유 영문 ID 매핑 (색상 적용을 위함)
    const categoryConfigs = [
        { name: "기획·재정", id: "finance" },
        { name: "경제·노동", id: "economy" },
        { name: "안전·행정", id: "safety" },
        { name: "문화·체육·관광", id: "culture" },
        { name: "미래과학·협력", id: "science" },
        { name: "도시·환경", id: "environment" },
        { name: "건설·교통", id: "construct" },
        { name: "보건·복지", id: "health" },
        { name: "농정·해양", id: "agri" },
        { name: "교육(기획/행정)", id: "edu" },
        { name: "여성·가족·평생교육", id: "women" },
        { name: "기타", id: "etc" }
    ];

    let allData = [];

    // 1. JSON 데이터 불러오기
    async function loadData() {
        try {
            // data.json에는 파이썬 봇이 저장한 최신 뉴스 배열이 들어있습니다.
            // 깃허브 캐시 방지를 위해 랜덤 쿼리스트링 추가
            const response = await fetch('data.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("데이터를 찾을 수 없습니다.");
            
            const jsonData = await response.json();
            document.getElementById('last-updated-time').innerText = jsonData.last_updated;
            allData = jsonData.articles;
            
            filterAndRender(); // 데이터 로드 완료 후 화면 그리기
        } catch (error) {
            console.error(error);
            document.getElementById('category-grid').innerHTML = 
                `<div class="no-data">
                    <h3>데이터 파일(data.json)을 불러오지 못했습니다.</h3>
                    <p>Github Actions 수집 봇이 정상적으로 실행되었는지 확인해 주세요.</p>
                </div>`;
        }
    }

    // 2. 필터링 로직
    function filterAndRender() {
        const selectedMuni = document.getElementById('select-muni').value;
        const selectedMember = document.getElementById('select-member').value;
        const keyword = document.getElementById('input-keyword').value.trim().toLowerCase();
        const isHotOnly = document.getElementById('check-hot').checked;

        // 4-Way 조건에 맞게 데이터 걸러내기
        let filteredData = allData.filter(article => {
            let match = true;
            
            // 시군 필터 (기사에 시군이름이 포함되어 있거나 추출된 municipality와 일치)
            if (selectedMuni && !article.municipality.includes(selectedMuni) && !article.title.includes(selectedMuni) && !article.content.includes(selectedMuni)) {
                match = false;
            }
            
            // 의원 필터 (제목이나 본문에 의원 이름이 있어야 함)
            if (selectedMember && !article.title.includes(selectedMember) && !article.content.includes(selectedMember)) {
                match = false;
            }
            
            // 추가 검색어 필터
            if (keyword && !article.title.toLowerCase().includes(keyword) && !article.content.toLowerCase().includes(keyword)) {
                match = false;
            }
            
            // 핫이슈 필터
            if (isHotOnly && !article.is_hot_issue) {
                match = false;
            }
            
            return match;
        });

        renderCategories(filteredData);
    }

    // 3. 화면 그리기 (아코디언 UI)
    function renderCategories(data) {
        const grid = document.getElementById('category-grid');
        grid.innerHTML = ''; // 초기화

        if(data.length === 0) {
            grid.innerHTML = `<div class="no-data">조건에 맞는 검색 결과가 없습니다.</div>`;
            return;
        }

        // 카테고리별로 기사 그룹화하기
        const groupedData = {};
        categoryConfigs.forEach(cat => groupedData[cat.name] = []);
        
        data.forEach(article => {
            const cat = article.category || "기타";
            if(groupedData[cat]) {
                groupedData[cat].push(article);
            } else {
                groupedData["기타"].push(article);
            }
        });

        // HTML 생성
        categoryConfigs.forEach(config => {
            const articles = groupedData[config.name];
            if (articles.length === 0) return; // 해당 분야에 기사가 없으면 카드를 안 그림

            const card = document.createElement('div');
            card.className = `category-card border-${config.id}`;
            
            // 카드 상단 (클릭 시 아코디언 토글)
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerHTML = `
                <div class="category-title">${config.name}</div>
                <div class="badge bg-${config.id}">
                    ${articles.length} <span class="toggle-icon">▼</span>
                </div>
            `;
            
            // 아코디언 클릭 이벤트
            header.addEventListener('click', () => {
                card.classList.toggle('active');
            });

            // 카드 하부 리스트 (기사 내용)
            const listContainer = document.createElement('div');
            listContainer.className = 'article-list';
            
            articles.forEach(article => {
                const item = document.createElement('div');
                item.className = 'article-item';
                
                const hotMark = article.is_hot_issue ? '<span class="hot-badge">🚨</span>' : '';
                const muniText = article.municipality && article.municipality !== "경기도의회" ? `[${article.municipality}] ` : '';

                item.innerHTML = `
                    <div class="article-meta">
                        <span>${muniText}${article.date}</span>
                    </div>
                    <div class="article-title">
                        ${hotMark}<a href="${article.url}" target="_blank">${article.title}</a>
                    </div>
                    <div class="article-snippet">${article.content}</div>
                `;
                listContainer.appendChild(item);
            });

            card.appendChild(header);
            card.appendChild(listContainer);
            grid.appendChild(card);
        });
    }

    // 4. 이벤트 리스너 등록 (사용자가 조작할 때마다 실시간 검색)
    document.getElementById('select-muni').addEventListener('change', filterAndRender);
    document.getElementById('select-member').addEventListener('change', filterAndRender);
    document.getElementById('check-hot').addEventListener('change', filterAndRender);
    document.getElementById('input-keyword').addEventListener('input', () => {
        // 타이핑 중 잦은 렌더링을 막기 위한 디바운스 처리
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(filterAndRender, 300);
    });

    // 시작할 때 데이터 불러오기
    window.onload = loadData;

</script>

</body>
</html>
