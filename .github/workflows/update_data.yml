### 2. 검색 버튼 추가 요청
검색 버튼이 있어야 사용이 더 편하시다면, `index.html` 파일의 `<div class="search-row">` 부분에 버튼을 하나 추가해 드리겠습니다. 

아래 코드를 복사해서 **`index.html`**의 해당 위치에 붙여넣어 주세요.

```html
<!-- index.html의 search-row 부분 아래에 추가 -->
<div class="search-row">
    <!-- 기존 선택창들... -->
    <button onclick="filterAndRender()" style="padding: 12px 20px; background-color: #333; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
        🔍 검색하기
    </button>
</div>
