name: 🔄 Update Press Data

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 저장소 수정 권한 부여

    steps:
      - name: 1. 내 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 2. 파이썬 환경 설정하기
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 파이썬 로봇 실행하기
        env: 
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python scraper.py

      - name: 4. 데이터 반영하기
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 자동 업데이트: 데이터 수집 완료" && git push)
```
